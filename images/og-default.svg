    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4c95d"/>
      <stop offset="1" stop-color="#e0a93a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#0e3b36"/>
