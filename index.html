<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0E7C66">
  <meta name="application-name" content="LankaLens">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LankaLens">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Lanka Lens — Buy & sell cameras, lenses, drones and photography gear in Sri Lanka. Prices in LKR.">
  <title>Lanka Lens — Buy &amp; Sell Cameras in Sri Lanka</title>
  <meta name="author" content="Lanka Lens">
  <meta name="robots" content="index, follow">
  <meta name="geo.region" content="LK">
  <meta name="geo.placename" content="Sri Lanka">
  <link rel="canonical" href="https://lankalens.lk/">
  <link rel="manifest" href="/manifest.webmanifest?v=1">
  <!-- Open Graph / Twitter: WhatsApp and Facebook previews are how most Sri
       Lankan buyers share listings, so these must exist in the static shell. -->
  <meta property="og:site_name" content="Lanka Lens">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Lanka Lens — Buy & Sell Cameras in Sri Lanka">
  <meta property="og:description" content="Sri Lanka's camera marketplace — DSLRs, mirrorless bodies, lenses, action cameras, drones and accessories, priced in LKR.">
  <meta property="og:url" content="https://lankalens.lk/">
  <meta property="og:image" content="/images/hero-camera.jpg">
  <meta property="og:locale" content="en_LK">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Lanka Lens — Buy & Sell Cameras in Sri Lanka">
  <meta name="twitter:description" content="Sri Lanka's camera marketplace — bodies, lenses, drones and gear, priced in LKR.">
  <meta name="twitter:image" content="/images/hero-camera.jpg">
  <!-- Use the actual LankaLens brand logo for browser tabs and installed app icons. -->
  <link rel="icon" type="image/svg+xml" href="/icons/lankalens-app-icon.svg?v=1">
  <link rel="shortcut icon" type="image/png" href="/images/Logo.png?v=2">
  <link rel="apple-touch-icon" href="/images/Logo.png?v=2">
  <!-- css/framework7.bundle.min.css (545 KB) was removed: Lanka Lens never
       initialises Framework7 and none of its 1365 class rules match anything the
       app renders. The handful of element-level resets it provided now live in
       lankalens.css ("Base element resets"). -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/lankalens.css">
</head>
<body>
  <div id="app">
    <main id="page" class="page-view"></main>

    <nav class="app-tabbar" id="tabbar" aria-label="Main navigation"></nav>

    <!-- drawer -->
    <div class="drawer-overlay" id="drawer-overlay" data-close-drawer></div>
    <aside class="drawer" id="drawer"></aside>

    <!-- overlays -->
    <div class="toast" id="toast"></div>
    <div id="sheet-host"></div>
    <div id="dialog-host"></div>
  </div>

  <script src="js/ionicons.js"></script>
  <script src="js/app.js"></script>
  <script src="js/business-social.js"></script>
  <script src="js/auth-policy.js"></script>
  <script src="js/browse-sheet-fix.js"></script>
  <script src="js/remove-demo-login.js"></script>
  <script src="js/shop-inventory.js"></script>
  <script src="js/pwa-install.js"></script>
</body>
</html>
