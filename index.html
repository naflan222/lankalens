<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script src="/js/meta-pixel.js"></script>
  <meta name="theme-color" content="#074236">
  <meta name="application-name" content="LankaLens">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="LankaLens">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Buy and sell cameras, lenses, action cameras, drones and accessories in Sri Lanka. Discover camera shops and photography gear on LankaLens.">
  <title>Lanka Lens — Buy &amp; Sell Cameras in Sri Lanka</title>
  <meta name="author" content="Lanka Lens">
  <meta name="robots" content="index, follow">
  <meta name="geo.region" content="LK">
  <meta name="geo.placename" content="Sri Lanka">
  <link rel="canonical" href="https://lankalens.lk/">
  <link rel="manifest" href="/manifest.webmanifest?v=3">
  <!-- Open Graph / Twitter: WhatsApp and Facebook previews are how most Sri
       Lankan buyers share listings, so these must exist in the static shell. -->
  <meta property="og:site_name" content="Lanka Lens">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Lanka Lens — Buy & Sell Cameras in Sri Lanka">
  <meta property="og:description" content="Buy and sell cameras, lenses, action cameras, drones and accessories in Sri Lanka. Discover camera shops and photography gear on LankaLens.">
  <meta property="og:url" content="https://lankalens.lk/">
  <meta property="og:image" content="/images/hero-camera.jpg">
  <meta property="og:locale" content="en_LK">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Lanka Lens — Buy & Sell Cameras in Sri Lanka">
  <meta name="twitter:description" content="Buy and sell cameras, lenses, action cameras, drones and accessories in Sri Lanka. Discover camera shops and photography gear on LankaLens.">
  <meta name="twitter:image" content="/images/hero-camera.jpg">
  <!-- Keep the proven PNG brand logo for browser/shortcut compatibility; Android
       PWA installs use square raster icons generated from this same logo. -->
  <link rel="icon" type="image/png" href="/images/Logo.png?v=2">
  <link rel="shortcut icon" type="image/png" href="/images/Logo.png?v=2">
  <link rel="apple-touch-icon" href="/images/Logo.png?v=2">
  <!-- css/framework7.bundle.min.css (545 KB) was removed: Lanka Lens never
       initialises Framework7 and none of its 1365 class rules match anything the
       app renders. The handful of element-level resets it provided now live in
       lankalens.css ("Base element resets"). -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/lankalens.css?v=20260918-3">
  <style>
    /* Cover the server-rendered SEO fallback only while the SPA is booting.
       The fallback remains in the DOM for crawlers and for no-JS users. */
    #app-boot-cover {
      position: fixed;
      inset: 0;
      z-index: 2147483000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background: #f7f9f8;
    }
    #app-boot-cover img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      border-radius: 16px;
    }
    #app-boot-cover .boot-spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(7, 66, 54, .18);
      border-top-color: #0E7C66;
      border-radius: 50%;
      animation: ll-boot-spin .8s linear infinite;
    }
    @keyframes ll-boot-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <noscript>
    <style>#app-boot-cover{display:none!important}</style>
    <img height="1" width="1" style="display:none" alt="" src="https://www.facebook.com/tr?id=2295151224578176&amp;ev=PageView&amp;noscript=1">
  </noscript>
  <div id="app-boot-cover" aria-hidden="true">
    <img src="/images/Logo.png?v=2" alt="">
    <div class="boot-spinner"></div>
  </div>
  <script>
    /* If the main app ever fails to boot, do not leave visitors stuck behind
       the cover; reveal the server-rendered fallback after a short timeout. */
    window.setTimeout(function () {
      var cover = document.getElementById('app-boot-cover');
      if (cover && cover.parentNode) cover.parentNode.removeChild(cover);
    }, 7000);
  </script>
  <div id="app">
    <main id="page" class="page-view"></main>

    <nav class="app-tabbar" id="tabbar" aria-label="Main navigation"></nav>

    <!-- drawer -->
    <div class="drawer-overlay" id="drawer-overlay" data-close-drawer></div>
    <aside class="drawer" id="drawer"></aside>

    <!-- overlays -->
    <div class="toast" id="toast"></div>
    <div id="sheet-host"></div>
    <div id="dialog-host"></div>
  </div>

  <script src="/js/ionicons.js"></script>
  <script src="/js/app.js?v=20260923-merchant1"></script>
  <script src="/js/business-social.js"></script>
  <script src="/js/auth-policy.js"></script>
  <script src="/js/browse-sheet-fix.js"></script>
  <script src="/js/remove-demo-login.js"></script>
  <script src="/js/shop-inventory.js"></script>
  <script src="/js/pwa-install.js"></script>
</body>
</html>
