name: Security checks

on:
  pull_request:
  push:
    branches:
      - security/harden-production

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            tests/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test and audit tools
        run: python -m pip install -r tests/requirements.txt pip-audit
      - name: Check Python syntax
        run: python -m compileall -q server tests
      - name: Check JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/auth-policy.js
      - name: Run security regression tests
        run: python -m pytest -q tests/test_security_static.py tests/test_password_policy_otp.py
      - name: Audit Python dependencies
        run: python -m pip_audit -r server/requirements.txt
